# ============================================================================
# environment.yml  --  Microsoft Fabric custom environment for
#                      NB_Projects_BdW_Hierarchical.ipynb
#                      (Python 3.13 -- matches Fabric's current 3.13.11 runtime)
# ============================================================================
#
# HOW TO USE IN MICROSOFT FABRIC
#   1. In your Fabric workspace: New -> Environment.
#   2. Open the Environment, go to "Public libraries", choose the
#      "Add from .yml" / "Upload environment.yml" option, and upload this file.
#   3. Save and Publish the Environment (first build can take ~10-20 minutes).
#   4. Attach the notebook to this Environment and run.
#
# THE BETA-DISCRETE-WEIBULL EXTENSION
#   The notebook's core model, BetaDiscreteWeibullModel (Fader/Hardie/Liu/
#   Davin/Steenburgh 2018, https://brucehardie.com/papers/037/), is NOT in the
#   PyPI release of pymc-marketing. It lives in the verified fork below, which
#   extends upstream pymc-labs/pymc-marketing additively and has full
#   ShiftedBetaGeoModel option parity (dual (alpha,beta)/(phi,kappa)
#   parameterisation, dropout covariates, expected_residual_lifetime) plus BdW
#   extras and per-customer censoring horizons. pip installs it straight from
#   GitHub (Fabric supports git URLs in the pip section).
#
# PYTHON 3.13 VERSION FLOORS (each verified to ship Python 3.13 / cp313 wheels)
#   numpy >= 2.1        first NumPy with cp313 wheels (2.0.x has none)
#   scipy >= 1.14.1     first SciPy with cp313 wheels
#   pandas >= 2.2.3     first pandas with cp313 wheels
#   pyarrow >= 18       first pyarrow with cp313 wheels
#   matplotlib >= 3.10  cp313 wheels; kept < 3.11 per the fork's pin
#   numba >= 0.61       first numba supporting Python 3.13 (pairs llvmlite 0.44+)
#   nutpie >= 0.14      first nutpie with cp313 wheels (0.13.x has none)
#   pymc 5.28.5+ / pytensor 2.38.2+ / arviz 0.20+ all support 3.13
#   (pymc/pytensor pins mirror the fork's own pyproject requirements.)
#
#   pyspark is provided by the Fabric runtime -- do not install it here.
# ============================================================================

name: bdw-clv-fabric

channels:
  - conda-forge

dependencies:
  # ---- interpreter (Fabric runtime: Python 3.13.11)
  - python=3.13

  # ---- core scientific stack (Python 3.13-compatible floors, verified)
  - numpy>=2.1,<3
  - scipy>=1.14.1
  - pandas>=2.2.3
  - python-dateutil>=2.8
  - pyarrow>=18                 # parquet / Fabric lakehouse I/O
  - matplotlib-base>=3.10,<3.11

  # ---- Bayesian modelling stack (mirrors the fork's pyproject)
  - pymc>=5.28.5,<6             # brings a compatible pytensor >= 2.38 automatically
  - arviz>=0.20,<1

  # ---- sampler: nutpie (MCMC = dict(..., nuts_sampler="nutpie"))
  - nutpie>=0.14,<1.0
  - numba>=0.61,<0.63           # nutpie's default compile backend; 0.61 = first py3.13 release
  # Optional jax backend if a logp op ever fails under numba
  # (then set MCMC["nuts_sampler_kwargs"] = {"backend": "jax"}):
  # - jax>=0.4.35

  # ---- the BdW-extended pymc-marketing fork (verified against upstream +
  #      the 2018 paper; includes full sBG option parity incl. covariates)
  - pip>=24
  - pip:
      - git+https://github.com/spudnik99/pymc-marketing.git